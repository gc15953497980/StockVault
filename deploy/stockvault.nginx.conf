# StockVault Nginx 配置
# 放置路径: /etc/nginx/sites-available/stockvault
# 启用: ln -s /etc/nginx/sites-available/stockvault /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名

    # 静态文件根目录
    root /var/www/stockvault;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # 前端路由 - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 新浪股票行情 API 代理
    location /api/sina/ {
        proxy_pass https://hq.sinajs.cn/;
        proxy_set_header Referer https://finance.sina.com.cn;
        proxy_set_header Host hq.sinajs.cn;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_hide_header Referer;
    }

    # 天天基金 API 代理
    location /api/fundnav/ {
        proxy_pass https://api.fund.eastmoney.com/;
        proxy_set_header Referer https://fundf10.eastmoney.com/;
        proxy_set_header Host api.fund.eastmoney.com;
        proxy_set_header User-Agent "Mozilla/5.0";
    }

    # 东方财富行情 API 代理
    location /api/benchmark/ {
        proxy_pass https://push2his.eastmoney.com/;
        proxy_set_header Host push2his.eastmoney.com;
        proxy_set_header User-Agent "Mozilla/5.0";
    }

    # 东方财富黄金K线 API 代理
    location /api/gold/ {
        proxy_pass https://push2his.eastmoney.com/;
        proxy_set_header Host push2his.eastmoney.com;
        proxy_set_header User-Agent "Mozilla/5.0";
    }

    # Gemini API 代理（Google AI Studio）
    location /api/gemini/ {
        proxy_pass https://generativelanguage.googleapis.com/;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
    }
}
